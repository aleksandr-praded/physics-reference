<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Вариант {{ variant_number }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="static/reveal/reveal.css" />
  <link rel="stylesheet" href="static/reveal/theme/white.css" />
  <style>
    body, .reveal {
      margin: 0;
      padding: 0;
    }

    .slide-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding-bottom: 80px; /* место для футера */
    }

    .slide-title {
      font-size: 2.0em;
      margin: 0;
      text-align: center;
      line-height: 1.3;
      white-space: pre-wrap;
    }

    /* === ЕДИНЫЙ ФУТЕР ДЛЯ ВСЕХ СЛАЙДОВ С ВОПРОСАМИ === */
    .slide-footer {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end; /* выравнивание по нижнему краю текста */
      font-size: 1.0em;
      color: #d00;
      font-weight: bold;
      line-height: 1;
      z-index: 100;
    }
  </style>
</head>
<body>

<div class="reveal">
  <div class="slides">

    <!-- НАЧАЛЬНЫЙ СЛАЙД -->
    <section data-autoslide="10000">
      <div class="slide-content">
        <div class="slide-title"><strong>Диктант начинается</strong></div>
        <div class="slide-footer">
          <span>Вариант {{ variant_number }}</span>
          <span></span>
        </div>
      </div>
    </section>

    <!-- ВОПРОСЫ -->
    {% for slide in slides %}
    <section data-autoslide="{{ slide.duration }}">
      <div class="slide-content">
        <div class="slide-title">{{ slide.name }}</div>
        <div class="slide-footer">
          <span>Вариант {{ variant_number }}</span>
          <span>Вопрос {{ slide.number }}</span>
        </div>
      </div>
    </section>
    {% endfor %}

    <!-- ФИНАЛЬНЫЙ СЛАЙД -->
    <section>
      <div class="slide-content">
        <div class="slide-title" ><strong>Диктант завершился</strong></div>
        <div class="slide-footer">
          <span>Вариант {{ variant_number }}</span>
          <span></span>
        </div>
      </div>
    </section>

  </div>
</div>

<script src="static/reveal/reveal.js"></script>
<script>
  Reveal.initialize({
    controls: false,
    progress: false,
    history: true,
    center: true,
    transition: 'none',
    autoSlideStoppable: false
  });
</script>

</body>
</html>
