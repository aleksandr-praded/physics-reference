<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Вариант {{ variant_number }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="static/reveal/reveal.css" />
  <link rel="stylesheet" href="static/reveal/theme/white.css" />
  <style>
    /* Убираем стандартные отступы */
    body, .reveal {
      margin: 0;
      padding: 0;
    }

    /* Основной контейнер слайда */
    .slide-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding-bottom: 90px; /* место для очень крупных номеров */
    }

    /* Заголовок вопроса */
    .slide-title {
      font-size: 2.0em;
      margin: 0;
      text-align: center;
      line-height: 1.3;
      white-space: pre-wrap;
    }

    /* === ПРИНУДИТЕЛЬНОЕ ПЕРЕОПРЕДЕЛЕНИЕ Reveal.js === */

    /* Номер страницы — правый нижний угол */
    .reveal .slides section .slide-number,
    .slide-number {
      position: absolute !important;
      bottom: 15px !important;
      right: 20px !important;
      font-size: 1.0em !important;
      color: #d00 !important;
      font-weight: bold !important;
      line-height: 1 !important;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2) !important;
      z-index: 100 !important;
      background: none !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      opacity: 1 !important;
    }

    /* Номер варианта — левый нижний угол */
    .reveal .slides section .variant-label,
    .variant-label {
      position: absolute !important;
      bottom: 25px !important;
      left: 20px !important;
      font-size: 1.0em !important;
      color: #d00 !important;
      font-weight: bold !important;
      z-index: 100 !important;
      background: none !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      opacity: 1 !important;
    }
  </style>
</head>
<body>

<div class="reveal">
  <div class="slides">

    <!-- ВОПРОСЫ (без титульного слайда) -->
    {% for slide in slides %}
    <section data-autoslide="{{ slide.duration }}">
      <div class="slide-content">
        <div class="slide-title">{{ slide.name }}</div>
        <div class="variant-label">Вариант {{ variant_number }}</div>
        <div class="slide-number">{{ slide.number }}</div>
      </div>
    </section>
    {% endfor %}

    <!-- ФИНАЛЬНЫЙ СЛАЙД -->
    <section>
      <div class="slide-content">
        <div class="slide-title">Презентация завершена</div>
        <div class="variant-label">Вариант {{ variant_number }}</div>
        <div class="slide-number">{{ slides|length + 1 }}</div>
      </div>
    </section>

  </div>
</div>

<script src="static/reveal/reveal.js"></script>
<script>
  Reveal.initialize({
    controls: false,
    progress: false,
    history: true,
    center: true,
    transition: 'none',
    autoSlideStoppable: false
  });
</script>

</body>
</html>
