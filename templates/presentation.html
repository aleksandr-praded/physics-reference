<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Вариант {{ variant_number }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="static/reveal/reveal.css" />
  <link rel="stylesheet" href="static/reveal/theme/white.css" />
  <style>
    body, .reveal {
      margin: 0;
      padding: 0;
    }

    .slide-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding-bottom: 80px;
    }

    .slide-title {
      font-size: 2.0em;
      margin: 0;
      text-align: center;
      line-height: 1.3;
      white-space: pre-wrap;
    }

    /* === ЕДИНЫЙ БАЗОВЫЙ СТИЛЬ === */
    .slide-footer-label {
      position: absolute;
      bottom: 20px;
      font-size: 1.2em;
      font-weight: bold;
      line-height: 1;
      z-index: 100;
    }

    /* Цвета */
    .variant-label {
      left: 20px;
      color: #d00; /* красный */
    }

    .question-label {
      right: 20px;
      color: #006400; /* тёмно-зелёный */
    }

    .timer-label {
      left: 50%;
      transform: translateX(-50%);
      color: #0066cc; /* синий */
    }
  </style>
</head>
<body>

<div class="reveal">
  <div class="slides">

    <!-- НАЧАЛЬНЫЙ СЛАЙД -->
    <section data-autoslide="60000" data-duration="60">
      <div class="slide-content">
        <div class="slide-title"><strong>Диктант начинается</strong></div>
        <div style="margin-top: 2em; font-size: 0.8em; text-align: left; max-width: 100%;">
          {{ instructions|replace('\n', '<br>')|safe }}
        </div>
        <div class="slide-footer-label variant-label">Вариант {{ variant_number }}</div>
        <div class="slide-footer-label timer-label">Ожидание...</div>
      </div>
    </section>

    <!-- ВОПРОСЫ -->
    {% for slide in slides %}
    <section data-autoslide="{{ slide.duration }}" data-duration="{{ slide.duration // 1000 }}">
      <div class="slide-content">
        <div class="slide-title">{{ slide.name }}</div>
        <div class="slide-footer-label variant-label">Вариант {{ variant_number }}</div>
        <div class="slide-footer-label question-label">Вопрос {{ slide.number }}</div>
        <div class="slide-footer-label timer-label">Готово...</div>
      </div>
    </section>
    {% endfor %}

    <!-- ФИНАЛЬНЫЙ СЛАЙД -->
    <section>
      <div class="slide-content">
        <div class="slide-title"><strong>Диктант завершился</strong></div>
        <div class="slide-footer-label variant-label">Вариант {{ variant_number }}</div>
      </div>
    </section>

  </div>
</div>

<script src="static/reveal/reveal.js"></script>
<script>
  Reveal.initialize({
    controls: false,
    progress: false,
    history: true,
    center: true,
    transition: 'none',
    autoSlideStoppable: false
  });

  let currentTimer = null;

  function startSlideTimer(durationSec) {
    if (currentTimer) clearInterval(currentTimer);

    let timeLeft = durationSec;
    const timerEl = document.querySelector('.reveal .slides section.present .timer-label');

    if (!timerEl || timeLeft <= 0) return;

    timerEl.textContent = `Осталось: ${timeLeft} с`;

    currentTimer = setInterval(() => {
      timeLeft--;
      if (timeLeft >= 0) {
        timerEl.textContent = `Осталось: ${timeLeft} с`;
      } else {
        clearInterval(currentTimer);
        timerEl.textContent = 'Время вышло!';
      }
    }, 1000);
  }

  Reveal.on('slidechanged', function(event) {
    const slide = event.currentSlide;
    const dur = slide.getAttribute('data-duration');
    if (dur) startSlideTimer(parseInt(dur));
  });

  Reveal.on('ready', function() {
    const first = document.querySelector('.reveal .slides section');
    const dur = first.getAttribute('data-duration');
    if (dur) startSlideTimer(parseInt(dur));
  });
</script>

</body>
</html>
